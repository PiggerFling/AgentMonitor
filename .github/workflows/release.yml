name: Release

on:
  push:
    tags: ['v*']
  # Manual runs only build by default: download the artifacts from the run
  # page to try them, then push a tag (or rerun with publish) to release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.0); leave empty to build the selected branch
        required: false
      publish:
        description: Publish a GitHub release for the tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon only. The other targets in electron-builder.yml are still
    # available locally through npm run dist.
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run build && npx electron-builder --mac dmg:arm64 zip:arm64 --publish never

      # One artifact per installer, uploaded unzipped and named after the file,
      # so each can be downloaded on its own. archive: false takes a single file.
      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          path: release/*-mac-arm64.dmg
          archive: false
          if-no-files-found: error

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          path: release/*-mac-arm64.zip
          archive: false
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a tag
        if: github.event_name != 'push' && !inputs.tag
        run: |
          echo "::error::Publishing needs the tag input."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: agent-monitor-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --title "Agent Monitor $TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag
